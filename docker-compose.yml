# ============================================================
# Niskala — Docker Compose
# ============================================================
# Services:
#   nginx    — reverse proxy (public entry)
#   backend  — Laravel 12 API (PHP 8.3 FPM + Nginx)
#   frontend — React SPA (Nginx static)
#   db       — MySQL 8.0 Database
# ============================================================

name: niskala

services:
  # ── Database (MySQL 8.0) ────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: niskala-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-${DB_PASSWORD:-niskala_secret123}}"
      MYSQL_DATABASE: "${DB_DATABASE:-niskala}"
      MYSQL_USER: "${DB_USERNAME:-niskala}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-niskala_secret123}"
    ports:
      - "${DB_EXTERNAL_PORT:-3320}:3306"
    volumes:
      - niskala-db-data:/var/lib/mysql
    networks:
      - niskala-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: niskala-proxy
    ports:
      - "${NGINX_PORT:-8031}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - niskala-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Laravel API) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: niskala-backend
    ports:
      - "${BACKEND_PORT:-9003}:80"
    volumes:
      - niskala-logs:/var/www/html/storage/logs
      - niskala-storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Laravel
      APP_NAME: "${APP_NAME:-Niskala}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8031}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"

      # Database
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-niskala}"
      DB_USERNAME: "${DB_USERNAME:-niskala}"
      DB_PASSWORD: "${DB_PASSWORD:-niskala_secret123}"

      # Session
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_ENCRYPT: "${SESSION_ENCRYPT:-true}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      SESSION_HTTP_ONLY: "${SESSION_HTTP_ONLY:-true}"
      SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"

      # Sanctum
      SANCTUM_EXPIRATION: "${SANCTUM_EXPIRATION:-480}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-}"
      SANCTUM_TOKEN_PREFIX: "${SANCTUM_TOKEN_PREFIX:-niskala_}"

      # CORS
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8031,http://localhost:9003,http://localhost:9004,http://127.0.0.1:8031,http://127.0.0.1:9003,http://127.0.0.1:9004}"
      CORS_ALLOWED_METHODS: "${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}"
      CORS_ALLOWED_HEADERS: "${CORS_ALLOWED_HEADERS:-Accept,Authorization,Content-Type,Origin,X-Requested-With}"
      CORS_MAX_AGE: "${CORS_MAX_AGE:-600}"
      CORS_SUPPORTS_CREDENTIALS: "${CORS_SUPPORTS_CREDENTIALS:-false}"

      # Admin seeder
      ADMIN_NAME: "${ADMIN_NAME:-Administrator}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin12345678}"

      # Logging
      LOG_CHANNEL: "${LOG_CHANNEL:-daily}"
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      LOG_DAILY_DAYS: "${LOG_DAILY_DAYS:-30}"

      # Cache / Queue
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"

      # Swagger
      L5_SWAGGER_GENERATE_ALWAYS: "${L5_SWAGGER_GENERATE_ALWAYS:-false}"
      L5_SWAGGER_UI_PERSIST_AUTHORIZATION: "${L5_SWAGGER_UI_PERSIST_AUTHORIZATION:-false}"
    networks:
      - niskala-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Frontend (React SPA) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: niskala-frontend
    ports:
      - "${FRONTEND_PORT:-9004}:80"
    networks:
      - niskala-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ── Volumes ──────────────────────────────────────────────────
volumes:
  niskala-logs:
    name: niskala-logs
  niskala-storage:
    name: niskala-storage
  niskala-db-data:
    name: niskala-db-data

# ── Networks ─────────────────────────────────────────────────
networks:
  niskala-network:
    name: niskala-network
    driver: bridge
